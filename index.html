<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mini Tienda</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Mini Tienda</h1>
        <div class="cart">
            Carrito: <span id="cart-count">0</span>
        </div>
    </header>

    <main class="products">

        <div class="product">
            <img src="https://via.placeholder.com/150" alt="Producto 1">
            <h2>Camiseta</h2>
            <p>$20</p>
            <button onclick="addToCart(20)">Agregar</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/150" alt="Producto 2">
            <h2>Zapatillas</h2>
            <p>$50</p>
            <button onclick="addToCart(50)">Agregar</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/150" alt="Producto 3">
            <h2>Gorra</h2>
            <p>$15</p>
            <button onclick="addToCart(15)">Agregar</button>
        </div>

    </main>

    <footer>
        <h3>Total: $<span id="total">0</span></h3>
    </footer>

    <script src="script.js"></script>
</body>
</html>
